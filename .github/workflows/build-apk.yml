name: Build Qoriqlash APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & Gradle
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_ROOT"
          echo "sdk.dir=$SDK_ROOT" > local.properties

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name "sdkmanager" 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          fi

          if ! command -v gradle >/dev/null 2>&1; then
            curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /opt/gradle
            export PATH="/opt/gradle/gradle-8.7/bin:$PATH"
            echo "/opt/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"
          fi

      - name: Create project files
        run: |
          set -e
          mkdir -p .github/workflows app/src/main/assets app/src/main/java/uz/qoriqlash/app app/src/main/res/values

          cat <<'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Qoriqlash"
          include(":app")
          EOF

          cat <<'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat <<'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat <<'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "uz.qoriqlash.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "uz.qoriqlash.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-ktx:1.9.2")
              implementation("androidx.lifecycle:lifecycle-service:2.8.4")
              implementation("androidx.camera:camera-core:1.3.4")
              implementation("androidx.camera:camera-camera2:1.3.4")
              implementation("androidx.camera:camera-lifecycle:1.3.4")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
          }
          EOF

          cat <<'EOF' > app/proguard-rules.pro
          -keep class uz.qoriqlash.app.MainActivity$CameraBridge {
              @android.webkit.JavascriptInterface <methods>;
          }
          -keep class uz.qoriqlash.app.MonitorForegroundService { *; }
          EOF

          cat <<'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Qo‘riqlash</string>
          </resources>
          EOF

          cat <<'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="Qo‘riqlash"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <service
                      android:name=".MonitorForegroundService"
                      android:enabled="true"
                      android:exported="false"
                      android:stopWithTask="false"
                      android:foregroundServiceType="dataSync|camera" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat <<'EOF' > app/src/main/java/uz/qoriqlash/app/CameraAuthClient.kt
          package uz.qoriqlash.app

          import okhttp3.Credentials
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import java.security.MessageDigest
          import java.util.concurrent.TimeUnit

          object CameraAuthClient {
              private val sharedClient: OkHttpClient = OkHttpClient.Builder()
                  .connectTimeout(4, TimeUnit.SECONDS)
                  .readTimeout(6, TimeUnit.SECONDS)
                  .build()

              private fun md5(input: String): String {
                  val bytes = MessageDigest.getInstance("MD5").digest(input.toByteArray(Charsets.UTF_8))
                  return bytes.joinToString("") { "%02x".format(it) }
              }

              private fun parseDigestParams(header: String): Map<String, String> {
                  val map = mutableMapOf<String, String>()
                  val raw = header.removePrefix("Digest ").trim()
                  val regex = Regex("""([a-zA-Z0-9_-]+)\s*=\s*(?:"([^"]*)"|([^,\s]+))""")
                  for (m in regex.findAll(raw)) {
                      val k = m.groupValues[1]
                      val v = if (m.groupValues[2].isNotEmpty()) m.groupValues[2] else m.groupValues[3]
                      map[k] = v
                  }
                  return map
              }

              private fun buildDigestHeader(
                  method: String,
                  uri: String,
                  user: String,
                  pass: String,
                  challenge: String
              ): String? {
                  val p = parseDigestParams(challenge)
                  val realm = p["realm"] ?: return null
                  val nonce = p["nonce"] ?: return null
                  val qop = p["qop"]?.split(",")?.map { it.trim() }?.firstOrNull { it == "auth" || it == "auth-int" }
                  val opaque = p["opaque"]

                  val ha1 = md5("$user:$realm:$pass")
                  val ha2 = md5("$method:$uri")

                  return if (qop != null) {
                      val nc = "00000001"
                      val cnonce = md5(System.nanoTime().toString()).take(16)
                      val resp = md5("$ha1:$nonce:$nc:$cnonce:$qop:$ha2")
                      buildString {
                          append("Digest username=\"$user\", realm=\"$realm\", nonce=\"$nonce\", uri=\"$uri\", ")
                          append("response=\"$resp\", qop=$qop, nc=$nc, cnonce=\"$cnonce\"")
                          if (!opaque.isNullOrEmpty()) append(", opaque=\"$opaque\"")
                      }
                  } else {
                      val resp = md5("$ha1:$nonce:$ha2")
                      buildString {
                          append("Digest username=\"$user\", realm=\"$realm\", nonce=\"$nonce\", uri=\"$uri\", ")
                          append("response=\"$resp\"")
                          if (!opaque.isNullOrEmpty()) append(", opaque=\"$opaque\"")
                      }
                  }
              }

              fun fetchSnapshotBytes(urlStr: String, user: String, pass: String): ByteArray? {
                  val req1 = Request.Builder()
                      .url(urlStr)
                      .header("Cache-Control", "no-cache")
                      .build()

                  sharedClient.newCall(req1).execute().use { r1 ->
                      if (r1.isSuccessful) {
                          return r1.body?.bytes()
                      }
                      if (r1.code == 401 && (user.isNotEmpty() || pass.isNotEmpty())) {
                          val wwwAuth = r1.header("WWW-Authenticate") ?: ""
                          if (wwwAuth.contains("Digest", ignoreCase = true)) {
                              val parsedUrl = r1.request.url
                              val uriWithQuery = if (!parsedUrl.encodedQuery.isNullOrEmpty()) {
                                  "${parsedUrl.encodedPath}?${parsedUrl.encodedQuery}"
                              } else {
                                  parsedUrl.encodedPath
                              }
                              val digestHeader = buildDigestHeader("GET", uriWithQuery, user, pass, wwwAuth)
                              if (digestHeader != null) {
                                  val reqDigest = Request.Builder()
                                      .url(urlStr)
                                      .header("Cache-Control", "no-cache")
                                      .header("Authorization", digestHeader)
                                      .build()
                                  sharedClient.newCall(reqDigest).execute().use { rDigest ->
                                      if (rDigest.isSuccessful) return rDigest.body?.bytes()
                                  }
                              }
                          }

                          val reqBasic = Request.Builder()
                              .url(urlStr)
                              .header("Cache-Control", "no-cache")
                              .header("Authorization", Credentials.basic(user, pass))
                              .build()
                          sharedClient.newCall(reqBasic).execute().use { rBasic ->
                              if (rBasic.isSuccessful) return rBasic.body?.bytes()
                          }
                      }
                  }
                  return null
              }
          }
          EOF

          cat <<'EOF' > app/src/main/java/uz/qoriqlash/app/MonitorForegroundService.kt
          package uz.qoriqlash.app

          import android.Manifest
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.ImageFormat
          import android.graphics.Matrix
          import android.graphics.Rect
          import android.graphics.YuvImage
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.util.Size
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.ImageAnalysis
          import androidx.camera.core.ImageProxy
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat
          import androidx.lifecycle.LifecycleService
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.MultipartBody
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicBoolean
          import java.util.concurrent.atomic.AtomicReference
          import kotlin.math.abs
          import kotlin.math.ceil
          import kotlin.math.max
          import kotlin.math.min

          class MonitorForegroundService : LifecycleService() {

              companion object {
                  const val CHANNEL_ID = "qoriqlash_fg_channel"
                  const val NOTIF_ID = 7071
                  const val ACTION_START = "uz.qoriqlash.app.START_BG"
                  const val ACTION_STOP = "uz.qoriqlash.app.STOP_BG"
                  const val ACTION_BURST = "uz.qoriqlash.app.BURST_BG"
                  const val ACTION_SHOT = "uz.qoriqlash.app.SHOT_BG"
                  const val ACTION_CLEAR_LOG = "uz.qoriqlash.app.CLEAR_LOG"

                  val latestPreviewJpeg = AtomicReference<ByteArray?>(null)
                  val latestFullJpeg = AtomicReference<ByteArray?>(null)
                  val uiVisible = AtomicBoolean(true)
                  @Volatile var isRunning = false
                  @Volatile var isBurstRunning = false
                  @Volatile var burstSentCount = 0
                  @Volatile var lastStatusText = "O‘chiq"
                  @Volatile var eventsJson = "[]"
              }

              private val handler = Handler(Looper.getMainLooper())
              private val cameraExecutor = Executors.newSingleThreadExecutor()
              private val netExecutor = Executors.newFixedThreadPool(2)
              private val tgClient = OkHttpClient.Builder()
                  .connectTimeout(5, TimeUnit.SECONDS)
                  .readTimeout(10, TimeUnit.SECONDS)
                  .build()

              private var cameraProvider: ProcessCameraProvider? = null
              private var wakeLock: PowerManager.WakeLock? = null

              private var active = false
              private var manualStopped = false
              private var srcMode = "phone"
              private var facing = "environment"
              private var tok = ""
              private var cid = ""
              private var usr = ""
              private var pwd = ""
              private var sens = 5
              private var imgRes = "max"
              private var imgQual = 95
              private var durSec = 0
              private var fv = true
              private var fp = false
              private var fk = false
              private var fsched = false
              private var tStart = "08:00"
              private var tEnd = "22:00"
              private var urls: List<String> = emptyList()

              private val lastGray = mutableMapOf<String, ByteArray>()
              private val recentClipFrames = mutableListOf<ByteArray>()
              private var lastAlertMs = 0L
              private var lastAttMs = 0L
              private var lastAnalyzeMs = 0L
              private var lastPreviewMs = 0L
              private var lastClipRecordMs = 0L
              private var idx = 0
              private val ipPolling = AtomicBoolean(false)
              private val pendingShotNow = AtomicBoolean(false)

              private var burstActive = false
              private var burstCount = 0
              private var burstEndMs = 0L
              private var lastBurstSentMs = 0L
              private var monitorEndMs = 0L

              private val eventList = mutableListOf<JSONObject>()

              private fun pushEvent(type: String, text: String) {
                  val now = System.currentTimeMillis()
                  val fmt = SimpleDateFormat("dd.MM.yyyy HH:mm:ss", Locale.getDefault())
                  val obj = JSONObject().apply {
                      put("t", type)
                      put("x", text)
                      put("d", fmt.format(Date(now)))
                      put("ts", now)
                  }
                  synchronized(eventList) {
                      eventList.add(0, obj)
                      if (eventList.size > 300) {
                          while (eventList.size > 300) eventList.removeAt(eventList.size - 1)
                      }
                      val arr = JSONArray()
                      for (item in eventList) arr.put(item)
                      eventsJson = arr.toString()
                  }
              }

              private val ipPollRunnable = object : Runnable {
                  override fun run() {
                      if (!active || manualStopped) return
                      if (srcMode == "ip" && isScheduleOpen() && urls.isNotEmpty() && ipPolling.compareAndSet(false, true)) {
                          netExecutor.execute {
                              try {
                                  pollIpOnce()
                              } catch (_: Exception) {
                              } finally {
                                  ipPolling.set(false)
                              }
                          }
                      }
                      handler.postDelayed(this, 350L)
                  }
              }

              private val burstRunnable = object : Runnable {
                  override fun run() {
                      if (!active || manualStopped || !burstActive) return
                      val now = System.currentTimeMillis()
                      if (burstEndMs > 0L && now >= burstEndMs) {
                          stopBurstInternal()
                          return
                      }
                      if (srcMode == "ip") {
                          val frame = latestFullJpeg.get() ?: latestPreviewJpeg.get()
                          if (frame != null && frame.isNotEmpty()) {
                              sendBurstFrame(frame)
                          }
                      }
                      handler.postDelayed(this, 1000L)
                  }
              }

              private fun sendBurstFrame(frame: ByteArray) {
                  burstCount++
                  burstSentCount = burstCount
                  val countNow = burstCount
                  val kb = frame.size / 1024
                  lastStatusText = "⚡ 1s/1 rasm: $countNow ta ($kb KB)"
                  updateNotif(lastStatusText)
                  pushEvent("photo", "1s rasm #$countNow [$kb KB]")
                  netExecutor.execute {
                      sendTelegramPhoto(frame, "⚡ Fon 1s rasm #$countNow (${kb}KB)")
                  }
              }

              private val watchdogRunnable = object : Runnable {
                  override fun run() {
                      if (!active || manualStopped) return
                      val now = System.currentTimeMillis()
                      if (monitorEndMs > 0L && now >= monitorEndMs) {
                          stopAll(byUser = false)
                          return
                      }
                      if (fsched) {
                          val inside = isScheduleOpen()
                          if (inside && srcMode == "phone" && cameraProvider == null) {
                              startCameraX()
                          } else if (!inside && cameraProvider != null) {
                              stopCameraX()
                              lastStatusText = "🕰 Jadval kutish rejimida ($tStart - $tEnd)"
                              updateNotif(lastStatusText)
                          }
                      }
                      handler.postDelayed(this, 3000L)
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  createChannel()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  super.onStartCommand(intent, flags, startId)
                  when (intent?.action) {
                      ACTION_STOP -> {
                          stopAll(byUser = true)
                          return START_NOT_STICKY
                      }
                      ACTION_CLEAR_LOG -> {
                          synchronized(eventList) {
                              eventList.clear()
                              eventsJson = "[]"
                          }
                          return START_STICKY
                      }
                      ACTION_BURST -> {
                          manualStopped = false
                          val enable = intent.getBooleanExtra("enable", false)
                          val sec = intent.getIntExtra("sec", 0)
                          if (enable) {
                              burstActive = true
                              isBurstRunning = true
                              burstCount = 0
                              burstSentCount = 0
                              lastBurstSentMs = 0L
                              burstEndMs = if (sec > 0) System.currentTimeMillis() + sec * 1000L else 0L
                              handler.removeCallbacks(burstRunnable)
                              handler.post(burstRunnable)
                          } else {
                              stopBurstInternal()
                          }
                          return START_STICKY
                      }
                      ACTION_SHOT -> {
                          if (srcMode == "phone") {
                              pendingShotNow.set(true)
                          } else {
                              val frame = latestFullJpeg.get() ?: latestPreviewJpeg.get()
                              if (frame != null && frame.isNotEmpty()) {
                                  pushEvent("photo", "Qo‘lda rasm yuborildi (${frame.size / 1024} KB)")
                                  netExecutor.execute {
                                      sendTelegramPhoto(frame, "📸 Fon rasm (${frame.size / 1024}KB)")
                                  }
                              }
                          }
                          return START_STICKY
                      }
                      else -> {
                          manualStopped = false
                          srcMode = intent?.getStringExtra("src")?.trim() ?: "phone"
                          facing = intent?.getStringExtra("facing")?.trim() ?: "environment"
                          tok = intent?.getStringExtra("tok")?.trim() ?: ""
                          cid = intent?.getStringExtra("cid")?.trim() ?: ""
                          usr = intent?.getStringExtra("usr")?.trim() ?: ""
                          pwd = intent?.getStringExtra("pwd")?.trim() ?: ""
                          sens = (intent?.getIntExtra("sens", 5) ?: 5).coerceIn(1, 10)
                          imgRes = intent?.getStringExtra("imgRes")?.trim() ?: "max"
                          imgQual = ((intent?.getDoubleExtra("imgQual", 0.95) ?: 0.95) * 100).toInt().coerceIn(50, 98)
                          durSec = intent?.getIntExtra("dur", 0) ?: 0
                          fv = intent?.getBooleanExtra("fv", true) ?: true
                          fp = intent?.getBooleanExtra("fp", false) ?: false
                          fk = intent?.getBooleanExtra("fk", false) ?: false
                          fsched = intent?.getBooleanExtra("fsched", false) ?: false
                          tStart = intent?.getStringExtra("tStart")?.trim() ?: "08:00"
                          tEnd = intent?.getStringExtra("tEnd")?.trim() ?: "22:00"
                          urls = intent?.getStringArrayListExtra("urls")?.filter { it.isNotBlank() } ?: emptyList()

                          acquireWakeLock()
                          val initText = if (srcMode == "phone") {
                              "Telefon kamerasi tezkor rejimda faol"
                          } else {
                              "IP / NVR tezkor rejimda faol (${urls.size} kanal)"
                          }
                          lastStatusText = initText
                          startFgCompat(buildNotif(initText))

                          active = true
                          isRunning = true
                          monitorEndMs = if (durSec > 0) System.currentTimeMillis() + durSec * 1000L else 0L

                          if (srcMode == "phone") {
                              if (isScheduleOpen()) startCameraX() else stopCameraX()
                          } else {
                              stopCameraX()
                          }

                          handler.removeCallbacks(ipPollRunnable)
                          handler.post(ipPollRunnable)
                          handler.removeCallbacks(watchdogRunnable)
                          handler.post(watchdogRunnable)
                      }
                  }
                  return START_STICKY
              }

              override fun onTaskRemoved(rootIntent: Intent?) {
                  super.onTaskRemoved(rootIntent)
                  if (active && !manualStopped) {
                      try {
                          val restartIntent = Intent(applicationContext, MonitorForegroundService::class.java).apply {
                              action = ACTION_START
                              putExtra("src", srcMode)
                              putExtra("facing", facing)
                              putExtra("tok", tok)
                              putExtra("cid", cid)
                              putExtra("usr", usr)
                              putExtra("pwd", pwd)
                              putExtra("sens", sens)
                              putExtra("imgRes", imgRes)
                              putExtra("imgQual", imgQual / 100.0)
                              putExtra("dur", durSec)
                              putExtra("fv", fv)
                              putExtra("fp", fp)
                              putExtra("fk", fk)
                              putExtra("fsched", fsched)
                              putExtra("tStart", tStart)
                              putExtra("tEnd", tEnd)
                              putStringArrayListExtra("urls", ArrayList(urls))
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              applicationContext.startForegroundService(restartIntent)
                          } else {
                              applicationContext.startService(restartIntent)
                          }
                      } catch (_: Exception) {
                      }
                  }
              }

              private fun startFgCompat(notif: Notification) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      var types = ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC
                      if (srcMode == "phone" &&
                          ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED
                      ) {
                          types = types or ServiceInfo.FOREGROUND_SERVICE_TYPE_CAMERA
                      }
                      startForeground(NOTIF_ID, notif, types)
                  } else {
                      startForeground(NOTIF_ID, notif)
                  }
              }

              private fun stopBurstInternal() {
                  burstActive = false
                  isBurstRunning = false
                  handler.removeCallbacks(burstRunnable)
                  lastStatusText = if (srcMode == "phone") "Telefon kamerasi fonda faol" else "IP / NVR fonda faol"
                  if (active && !manualStopped) updateNotif(lastStatusText)
              }

              private fun stopAll(byUser: Boolean) {
                  if (byUser) manualStopped = true
                  active = false
                  isRunning = false
                  stopBurstInternal()
                  handler.removeCallbacks(ipPollRunnable)
                  handler.removeCallbacks(watchdogRunnable)
                  stopCameraX()
                  releaseWakeLock()
                  lastStatusText = "O‘chiq"
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }

              override fun onDestroy() {
                  active = false
                  isRunning = false
                  stopCameraX()
                  releaseWakeLock()
                  cameraExecutor.shutdown()
                  netExecutor.shutdown()
                  super.onDestroy()
              }

              private fun acquireWakeLock() {
                  try {
                      if (wakeLock == null) {
                          val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                          wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Qoriqlash::BgWakeLock")
                      }
                      if (wakeLock?.isHeld == false) {
                          wakeLock?.acquire(24 * 60 * 60 * 1000L)
                      }
                  } catch (_: Exception) {
                  }
              }

              private fun releaseWakeLock() {
                  try {
                      if (wakeLock?.isHeld == true) wakeLock?.release()
                  } catch (_: Exception) {
                  }
              }

              private fun parseMins(hhmm: String): Int? {
                  val parts = hhmm.split(":")
                  if (parts.size != 2) return null
                  val h = parts[0].toIntOrNull() ?: return null
                  val m = parts[1].toIntOrNull() ?: return null
                  if (h !in 0..23 || m !in 0..59) return null
                  return h * 60 + m
              }

              private fun isScheduleOpen(): Boolean {
                  if (!fsched) return true
                  val s = parseMins(tStart) ?: return true
                  val e = parseMins(tEnd) ?: return true
                  if (s == e) return true
                  val cal = Calendar.getInstance()
                  val cur = cal.get(Calendar.HOUR_OF_DAY) * 60 + cal.get(Calendar.MINUTE)
                  return if (s < e) cur in s until e else (cur >= s || cur < e)
              }

              private fun startCameraX() {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      lastStatusText = "❌ Kamera ruxsati berilmagan"
                      updateNotif(lastStatusText)
                      return
                  }
                  val future = ProcessCameraProvider.getInstance(this)
                  future.addListener({
                      try {
                          val provider = future.get()
                          cameraProvider = provider
                          provider.unbindAll()

                          val targetSize = when (imgRes) {
                              "1080" -> Size(1280, 720)
                              "720" -> Size(960, 540)
                              "480" -> Size(640, 480)
                              else -> Size(1280, 720)
                          }

                          val analysis = ImageAnalysis.Builder()
                              .setTargetResolution(targetSize)
                              .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                              .build()

                          analysis.setAnalyzer(cameraExecutor) { image ->
                              processPhoneFrame(image)
                          }

                          val selector = if (facing == "user") {
                              CameraSelector.DEFAULT_FRONT_CAMERA
                          } else {
                              CameraSelector.DEFAULT_BACK_CAMERA
                          }

                          provider.bindToLifecycle(this, selector, analysis)
                          lastStatusText = "📷 Telefon kamerasi faol (${if (facing == "user") "Oldi" else "Orqa"})"
                          updateNotif(lastStatusText)
                      } catch (e: Exception) {
                          lastStatusText = "❌ Kamera ochilmadi: ${e.message}"
                          updateNotif(lastStatusText)
                      }
                  }, ContextCompat.getMainExecutor(this))
              }

              private fun stopCameraX() {
                  try {
                      cameraProvider?.unbindAll()
                      cameraProvider = null
                  } catch (_: Exception) {
                  }
              }

              private fun recordClipFrame(jpeg: ByteArray) {
                  if (!fv) return
                  synchronized(recentClipFrames) {
                      recentClipFrames.add(jpeg)
                      if (recentClipFrames.size > 15) {
                          recentClipFrames.removeAt(0)
                      }
                  }
              }

              private fun sendMotionClipIfEnabled(caption: String) {
                  if (!fv) return
                  val framesCopy: List<ByteArray>
                  synchronized(recentClipFrames) {
                      framesCopy = recentClipFrames.takeLast(12)
                  }
                  if (framesCopy.isEmpty()) return
                  val first = framesCopy.first()
                  sendTelegramPhoto(first, "$caption — ketma-ketlik (${framesCopy.size} kadr)")
              }

              private fun estimateCount(prev: ByteArray, curr: ByteArray, width: Int): Int {
                  if (!fp || prev.size != curr.size || width <= 0) return 0
                  val activeCols = mutableSetOf<Int>()
                  val h = curr.size / max(1, width)
                  var y = 0
                  while (y < h) {
                      var x = 0
                      while (x < width) {
                          val i = y * width + x
                          if (abs((curr[i].toInt() and 0xFF) - (prev[i].toInt() and 0xFF)) > 24) {
                              activeCols.add(x / max(1, width / 8))
                          }
                          x += 2
                      }
                      y += 2
                  }
                  if (activeCols.isEmpty()) return 0
                  return max(1, min(10, ceil(activeCols.size / 2.0).toInt()))
              }

              private fun triggerAttendanceIfEnabled(camTag: String) {
                  if (!fk) return
                  val now = System.currentTimeMillis()
                  if (now - lastAttMs < 60000L) return
                  lastAttMs = now
                  val hr = Calendar.getInstance().get(Calendar.HOUR_OF_DAY)
                  val mode = if (hr < 13) "Keldi (kirish)" else "Ketdi/harakat (chiqish)"
                  pushEvent("att", "Davomat: $mode$camTag")
                  netExecutor.execute {
                      sendTelegramText("🕘 Davomat qayd etildi: $mode$camTag")
                  }
              }

              private fun processPhoneFrame(image: ImageProxy) {
                  try {
                      val now = System.currentTimeMillis()
                      if (!active || manualStopped || !isScheduleOpen()) return
                      if (now - lastAnalyzeMs < 110L) return
                      lastAnalyzeMs = now

                      val yPlane = image.planes[0]
                      val yBuf = yPlane.buffer
                      val w = image.width
                      val h = image.height
                      val rowStride = yPlane.rowStride

                      val step = 10
                      val sw = (w / step).coerceAtLeast(1)
                      val sh = (h / step).coerceAtLeast(1)
                      val sample = ByteArray(sw * sh)
                      var k = 0
                      var y = 0
                      while (y < h && k < sample.size) {
                          var x = 0
                          val rowOffset = y * rowStride
                          while (x < w && k < sample.size) {
                              val idxBuf = rowOffset + x
                              if (idxBuf < yBuf.limit()) {
                                  sample[k++] = yBuf.get(idxBuf)
                              }
                              x += step
                          }
                          y += step
                      }

                      val key = "phone_$facing"
                      val prev = lastGray[key]
                      lastGray[key] = sample

                      var motionDetected = false
                      var estPeople = 0
                      if (prev != null && prev.size == sample.size) {
                          var diff = 0
                          for (i in sample.indices) {
                              if (abs((sample[i].toInt() and 0xFF) - (prev[i].toInt() and 0xFF)) > 22) {
                                  diff++
                              }
                          }
                          val ratio = (diff * 100.0) / sample.size.coerceAtLeast(1)
                          val threshold = (11 - sens) * 1.15
                          if (ratio > threshold) {
                              motionDetected = true
                              estPeople = estimateCount(prev, sample, sw)
                          }
                      }

                      val needAlert = motionDetected && (now - lastAlertMs > 10000L)
                      val needBurst = burstActive && (now - lastBurstSentMs >= 950L)
                      val needShot = pendingShotNow.compareAndSet(true, false)
                      val needClip = fv && (now - lastClipRecordMs >= 900L)

                      if (needAlert || needBurst || needShot || needClip) {
                          val fullJpeg = imageProxyToJpeg(image, imgQual, maxSide = 0)
                          if (fullJpeg != null && fullJpeg.isNotEmpty()) {
                              latestFullJpeg.set(fullJpeg)
                              if (needClip) {
                                  lastClipRecordMs = now
                                  recordClipFrame(fullJpeg)
                              }
                              if (needShot) {
                                  pushEvent("photo", "Qo‘lda rasm yuborildi (${fullJpeg.size / 1024} KB)")
                                  netExecutor.execute {
                                      sendTelegramPhoto(fullJpeg, "📸 Fon rasm (${fullJpeg.size / 1024}KB)")
                                  }
                              }
                              if (needBurst) {
                                  if (burstEndMs > 0L && now >= burstEndMs) {
                                      handler.post { stopBurstInternal() }
                                  } else {
                                      lastBurstSentMs = now
                                      sendBurstFrame(fullJpeg)
                                  }
                              }
                              if (needAlert) {
                                  lastAlertMs = now
                                  val camLabel = if (facing == "user") "Oldi kamera" else "Orqa kamera"
                                  val extra = if (estPeople > 0) " — taxminan $estPeople ta harakat/odam" else ""
                                  val msgTxt = "Harakat aniqlandi [$camLabel]$extra"
                                  pushEvent("motion", msgTxt)
                                  triggerAttendanceIfEnabled(" [$camLabel]")
                                  lastStatusText = "🚨 $msgTxt"
                                  updateNotif(lastStatusText)
                                  netExecutor.execute {
                                      sendTelegramPhoto(fullJpeg, "🚨 Qo‘riqlash: $msgTxt")
                                      sendMotionClipIfEnabled("🎬 $msgTxt")
                                  }
                              }
                          }
                      }

                      if (uiVisible.get() && (now - lastPreviewMs >= 240L)) {
                          lastPreviewMs = now
                          val prevJpeg = imageProxyToJpeg(image, 62, maxSide = 360)
                          if (prevJpeg != null && prevJpeg.isNotEmpty()) {
                              latestPreviewJpeg.set(prevJpeg)
                          }
                      }
                  } catch (_: Exception) {
                  } finally {
                      image.close()
                  }
              }

              private fun yuv420ToNv21(image: ImageProxy): ByteArray {
                  val width = image.width
                  val height = image.height
                  val ySize = width * height
                  val uvSize = width * height / 2
                  val nv21 = ByteArray(ySize + uvSize)

                  val yPlane = image.planes[0]
                  val uPlane = image.planes[1]
                  val vPlane = image.planes[2]

                  val yBuffer = yPlane.buffer
                  val yRowStride = yPlane.rowStride
                  val yPixelStride = yPlane.pixelStride

                  var outIndex = 0
                  for (row in 0 until height) {
                      var yIdx = row * yRowStride
                      for (col in 0 until width) {
                          nv21[outIndex++] = if (yIdx >= 0 && yIdx < yBuffer.limit()) yBuffer.get(yIdx) else 0
                          yIdx += yPixelStride
                      }
                  }

                  val uBuffer = uPlane.buffer
                  val vBuffer = vPlane.buffer
                  val uRowStride = uPlane.rowStride
                  val vRowStride = vPlane.rowStride
                  val uPixelStride = uPlane.pixelStride
                  val vPixelStride = vPlane.pixelStride

                  val chromaHeight = height / 2
                  val chromaWidth = width / 2
                  for (row in 0 until chromaHeight) {
                      var vIdx = row * vRowStride
                      var uIdx = row * uRowStride
                      for (col in 0 until chromaWidth) {
                          nv21[outIndex++] = if (vIdx >= 0 && vIdx < vBuffer.limit()) vBuffer.get(vIdx) else 128.toByte()
                          nv21[outIndex++] = if (uIdx >= 0 && uIdx < uBuffer.limit()) uBuffer.get(uIdx) else 128.toByte()
                          vIdx += vPixelStride
                          uIdx += uPixelStride
                      }
                  }
                  return nv21
              }

              private fun imageProxyToJpeg(image: ImageProxy, quality: Int, maxSide: Int): ByteArray? {
                  return try {
                      val nv21 = yuv420ToNv21(image)
                      val yuvImage = YuvImage(nv21, ImageFormat.NV21, image.width, image.height, null)
                      val out = ByteArrayOutputStream()
                      yuvImage.compressToJpeg(Rect(0, 0, image.width, image.height), quality, out)
                      val rawJpeg = out.toByteArray()

                      val rot = image.imageInfo.rotationDegrees
                      if (rot == 0 && maxSide <= 0) return rawJpeg

                      val opts = BitmapFactory.Options()
                      if (maxSide > 0) {
                          val longest = max(image.width, image.height)
                          var sample = 1
                          while (longest / (sample * 2) >= maxSide) sample *= 2
                          opts.inSampleSize = sample
                      }
                      val bmp = BitmapFactory.decodeByteArray(rawJpeg, 0, rawJpeg.size, opts) ?: return rawJpeg
                      if (rot == 0) {
                          val outNoRot = ByteArrayOutputStream()
                          bmp.compress(Bitmap.CompressFormat.JPEG, quality, outNoRot)
                          bmp.recycle()
                          return outNoRot.toByteArray()
                      }
                      val m = Matrix().apply { postRotate(rot.toFloat()) }
                      val rotated = Bitmap.createBitmap(bmp, 0, 0, bmp.width, bmp.height, m, true)
                      bmp.recycle()
                      val out2 = ByteArrayOutputStream()
                      rotated.compress(Bitmap.CompressFormat.JPEG, quality, out2)
                      rotated.recycle()
                      out2.toByteArray()
                  } catch (_: Exception) {
                      null
                  }
              }

              private fun pollIpOnce() {
                  if (urls.isEmpty()) return
                  val url = urls[idx % urls.size]
                  idx++

                  val bytes = CameraAuthClient.fetchSnapshotBytes(url, usr, pwd) ?: return
                  if (bytes.isEmpty()) return
                  latestFullJpeg.set(bytes)
                  latestPreviewJpeg.set(bytes)
                  recordClipFrame(bytes)

                  val opts = BitmapFactory.Options().apply { inSampleSize = 4 }
                  val bmp = BitmapFactory.decodeByteArray(bytes, 0, bytes.size, opts) ?: return
                  val w = bmp.width.coerceAtLeast(1)
                  val h = bmp.height.coerceAtLeast(1)
                  val pixels = IntArray(w * h)
                  bmp.getPixels(pixels, 0, w, 0, 0, w, h)
                  bmp.recycle()

                  val gray = ByteArray(w * h)
                  for (i in pixels.indices) {
                      val p = pixels[i]
                      val r = (p ushr 16) and 0xFF
                      val g = (p ushr 8) and 0xFF
                      val b = p and 0xFF
                      gray[i] = ((r * 30 + g * 59 + b * 11) / 100).toByte()
                  }

                  val prev = lastGray[url]
                  lastGray[url] = gray
                  if (prev != null && prev.size == gray.size) {
                      var diff = 0
                      var sampled = 0
                      var i = 0
                      while (i < gray.size) {
                          sampled++
                          if (abs((gray[i].toInt() and 0xFF) - (prev[i].toInt() and 0xFF)) > 22) {
                              diff++
                          }
                          i += 3
                      }
                      val ratio = if (sampled > 0) (diff * 100.0) / sampled else 0.0
                      val threshold = (11 - sens) * 1.15
                      val now = System.currentTimeMillis()
                      if (ratio > threshold && now - lastAlertMs > 10000L) {
                          lastAlertMs = now
                          val est = estimateCount(prev, gray, w)
                          val extra = if (est > 0) " — taxminan $est ta harakat/odam" else ""
                          val msgTxt = "IP/NVR harakat ($url)$extra"
                          pushEvent("motion", msgTxt)
                          triggerAttendanceIfEnabled(" [$url]")
                          lastStatusText = "🚨 $msgTxt"
                          updateNotif(lastStatusText)
                          sendTelegramPhoto(bytes, "🚨 Fon nazorati: $msgTxt")
                          sendMotionClipIfEnabled("🎬 $msgTxt")
                      }
                  }
              }

              private fun sendTelegramText(text: String) {
                  if (tok.isEmpty() || cid.isEmpty()) return
                  try {
                      val body = MultipartBody.Builder()
                          .setType(MultipartBody.FORM)
                          .addFormDataPart("chat_id", cid)
                          .addFormDataPart("text", text)
                          .build()
                      val req = Request.Builder()
                          .url("https://api.telegram.org/bot$tok/sendMessage")
                          .post(body)
                          .build()
                      tgClient.newCall(req).execute().close()
                  } catch (_: Exception) {
                  }
              }

              private fun sendTelegramPhoto(jpegBytes: ByteArray, caption: String) {
                  if (tok.isEmpty() || cid.isEmpty()) return
                  try {
                      val body = MultipartBody.Builder()
                          .setType(MultipartBody.FORM)
                          .addFormDataPart("chat_id", cid)
                          .addFormDataPart("caption", caption)
                          .addFormDataPart(
                              "photo",
                              "snap.jpg",
                              jpegBytes.toRequestBody("image/jpeg".toMediaType())
                          )
                          .build()
                      val req = Request.Builder()
                          .url("https://api.telegram.org/bot$tok/sendPhoto")
                          .post(body)
                          .build()
                      tgClient.newCall(req).execute().close()
                  } catch (_: Exception) {
                  }
              }

              private fun updateNotif(text: String) {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.notify(NOTIF_ID, buildNotif(text))
              }

              private fun buildNotif(text: String): Notification {
                  val openIntent = Intent(this, MainActivity::class.java)
                  val pi = PendingIntent.getActivity(
                      this, 0, openIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val stopIntent = Intent(this, MonitorForegroundService::class.java).apply {
                      action = ACTION_STOP
                  }
                  val stopPi = PendingIntent.getService(
                      this, 1, stopIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("Qo‘riqlash · CYBER-BOT")
                      .setContentText(text)
                      .setSmallIcon(android.R.drawable.ic_menu_camera)
                      .setContentIntent(pi)
                      .addAction(android.R.drawable.ic_delete, "To‘xtatish", stopPi)
                      .setOngoing(true)
                      .build()
              }

              private fun createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val ch = NotificationChannel(
                          CHANNEL_ID,
                          "Qo‘riqlash uzluksiz fon xizmati",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.createNotificationChannel(ch)
                  }
              }
          }
