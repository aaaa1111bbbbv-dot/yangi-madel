          <canvas id="c" class="hide"></canvas>
          <script>
          const H="0483921c9d5a28b0671d581a463abd3d8f0c507cd88d66d66350677a3d430a66";
          const $=i=>document.getElementById(i);
          const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
          const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
          let S=ld('qoriqlash_s',ld('isab_s',{
            src:'phone',facing:'environment',dur:0,imgRes:'max',imgQual:0.95,
            fsched:false,tStart:'08:00',tEnd:'22:00',
            tok:'',cid:'',fv:true,fp:false,fk:false,fw:true,sens:7
          }));
          const F={br:'br',ipa:'ipa',prt:'prt',usr:'usr',pwd:'pwd',chs:'chs',ip:'ipu'};
          let LOG=ld('qoriqlash_log',ld('isab_log',[])),run=false,wl=null,previewTimer=null,lastFrameSig='';

          function sha256(s){
           const r=(n,x)=>(x>>>n)|(x<<(32-n));
           const K=[],h=[];let p=0,c={};
           for(let n=2;p<64;n++){if(!c[n]){for(let i=0;i<313;i+=n)c[i]=n;h[p]=(Math.pow(n,.5)*4294967296)|0;K[p++]=(Math.pow(n,1/3)*4294967296)|0}}
           h.length=8;
           const b=unescape(encodeURIComponent(s));const l=b.length*8;const w=[];
           for(let i=0;i<b.length;i++)w[i>>2]|=b.charCodeAt(i)<<(24-(i%4)*8);
           w[b.length>>2]|=0x80<<(24-(b.length%4)*8);
           const len=((b.length+8>>6)+1)*16;w[len-1]=l;
           for(let j=0;j<len;j+=16){const a=w.slice(j,j+16),o=h.slice(0);
            for(let i=0;i<64;i++){
             if(i>=16){const a15=a[i-15]|0,a2=a[i-2]|0;
              a[i]=(a[i-16]|0)+(r(7,a15)^r(18,a15)^(a15>>>3))+(a[i-7]|0)+(r(17,a2)^r(19,a2)^(a2>>>10))|0}
             const e=o[4],A=o[0];
             const t1=(o[7]+(r(6,e)^r(11,e)^r(25,e))+((e&o[5])^(~e&o[6]))+K[i]+(a[i]|0))|0;
             const t2=((r(2,A)^r(13,A)^r(22,A))+((A&o[1])^(A&o[2])^(o[1]&o[2])))|0;
             o.unshift((t1+t2)|0);o[4]=(o[4]+t1)|0;o.pop()}
            for(let i=0;i<8;i++)h[i]=(h[i]+o[i])|0}
           return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}
          async function sha(s){return sha256(s)}

          async function login(){
           const h=await sha($('u').value.trim()+':'+$('p').value.trim());
           if(h===H){sv('qoriqlash_auth',1);enter()}else $('ge').textContent='Kod yoki parol noto‘g‘ri';}
          function enter(){$('gate').classList.add('hide');$('app').classList.remove('hide');init();}
          function logout(){localStorage.removeItem('qoriqlash_auth');localStorage.removeItem('isab_auth');location.reload()}
          if(ld('qoriqlash_auth',0)===1||ld('isab_auth',0)===1)enter();

          function allowBgBattery(){
           if(window.Android&&typeof Android.requestIgnoreBattery==='function'){
            Android.requestIgnoreBattery();
           }else{
            msg('s1','Telefon sozlamalaridan batareya tejashni Cheklovsiz qiling','ok');
           }
          }

          function updateCamBadge(){
           if(S.src==='ip'){$('camBadge').textContent='IP / NVR REJIM';return;}
           $('camBadge').textContent=S.facing==='user'?'OLDI KAMERA':'ORQA KAMERA';
          }

          function syncDurationUI(){
           const sec=Math.max(0,+(S.dur||0));
           const presetVals=['0','15','30','60','180','300'];
           $('dur').value=presetVals.includes(String(sec))?String(sec):'0';
           $('customSec').value=sec>0?String(sec):'';
          }

          function onDurPreset(){
           S.dur=Math.max(0,+($('dur').value||0));
           $('customSec').value=S.dur>0?String(S.dur):'';
           save();
          }

          function onCustomSec(){
           const raw=parseInt($('customSec').value,10);
           S.dur=(!isNaN(raw)&&raw>0)?Math.min(86400,raw):0;
           syncDurationUI();
           save();
          }

          function parseMins(hhmm){
           const m=(hhmm||'').match(/^(\d{1,2}):(\d{2})$/);
           if(!m)return null;
           const h=parseInt(m[1],10),min=parseInt(m[2],10);
           if(h<0||h>23||min<0||min>59)return null;
           return h*60+min;
          }

          function isWithinSchedule(){
           if(!S.fsched)return true;
           const s=parseMins(S.tStart||'08:00');
           const e=parseMins(S.tEnd||'22:00');
           if(s===null||e===null)return true;
           const now=new Date();
           const cur=now.getHours()*60+now.getMinutes();
           if(s===e)return true;
           if(s<e)return cur>=s&&cur<e;
           return cur>=s||cur<e;
          }

          function updateScheduleStatus(){
           if(!S.fsched){
            $('sSched').textContent='Kunlik soat jadvali o‘chiq';
            $('sSched').className='st';
            return;
           }
           const inside=isWithinSchedule();
           $('sSched').textContent=`Jadval (${S.tStart||'08:00'} – ${S.tEnd||'22:00'}): ${inside?'HOZIR FAOL VAQTDA':'KUTISH REJIMIDA'}`;
           $('sSched').className='st '+(inside?'ok':'');
          }

          const splitList=v=>(v||'').split(/[\n,]+/).map(x=>x.trim()).filter(Boolean);
          function parseChannels(raw){
           const parts=(raw||'1').split(/[\s,]+/).map(x=>x.trim()).filter(Boolean);
           const set=new Set();
           for(const p of parts){
            const range=p.match(/^(\d+)-(\d+)$/);
            if(range){
             const a=Math.max(1,parseInt(range[1],10));
             const b=Math.min(64,parseInt(range[2],10));
             for(let n=a;n<=b;n++)set.add(String(n));
            }else if(/^\d+$/.test(p)){
             set.add(String(Math.max(1,parseInt(p,10))));
            }
           }
           return set.size?[...set]:['1'];
          }

          function camTargets(){
           if(S.br==='url'){
            return splitList(S.ip).map((u,idx)=>({key:'u'+idx,label:'URL #'+(idx+1),url:u}));
           }
           const ips=splitList(S.ipa);
           const channels=parseChannels(S.chs);
           const out=[];
           for(const ip of ips){
            const base=(/^https?:\/\//i.test(ip)?ip.replace(/\/+$/,''):'http://'+ip)+(S.prt&&S.prt!='80'&&!/:\d+$/.test(ip)?':'+S.prt:'');
            for(const ch of channels){
             const url=S.br==='dahua'
              ?base+'/cgi-bin/snapshot.cgi?channel='+ch
              :base+'/ISAPI/Streaming/channels/'+(+ch*100+1)+'/picture';
             out.push({key:ip+'_'+ch,label:ip+' (kan '+ch+')',url});
            }
           }
           return out;
          }

          function pushConfigToNative(enable){
           if(!window.Android||typeof Android.setBgMonitor!=='function')return;
           const urlsCsv=camTargets().map(t=>t.url).join('||');
           Android.setBgMonitor(
            !!enable,
            S.src||'phone',
            S.facing||'environment',
            S.tok||'',
            S.cid||'',
            S.usr||'',
            S.pwd||'',
            +(S.sens||7),
            S.imgRes||'max',
            +(S.imgQual||0.95),
            Math.max(0,+(S.dur||0)),
            !!S.fv,
            !!S.fp,
            !!S.fk,
            !!S.fsched,
            S.tStart||'08:00',
            S.tEnd||'22:00',
            urlsCsv
           );
          }

          function syncNativeEvents(){
           if(!window.Android||typeof Android.getNativeEvents!=='function')return;
           try{
            const arr=JSON.parse(Android.getNativeEvents()||'[]');
            if(Array.isArray(arr)&&arr.length){
             const map=new Map();
             for(const e of [...arr,...LOG]){
              const k=(e.ts||0)+'|'+(e.x||'');
              if(!map.has(k))map.set(k,e);
             }
             LOG=[...map.values()].sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,300);
             sv('qoriqlash_log',LOG);
             renderLog();
            }
           }catch(e){}
          }

          let syncTick=0;
          function pollNativePreview(){
           if(!window.Android||typeof Android.getBgState!=='function')return;
           try{
            const st=JSON.parse(Android.getBgState());
            run=!!st.running;
            sv('qoriqlash_run',run);
            if(run){
             $('go').textContent='⏹ To‘xtatish';$('go').classList.add('r');
             $('state').textContent='● Tezkor 24/7';$('state').className='st ok';
             $('dot').textContent='● '+(st.status||'Faol');
            }else{
             $('go').textContent='▶ Nazoratni boshlash';$('go').classList.remove('r');
             $('state').textContent='○ O‘chiq';$('state').className='st';
             $('dot').textContent='● Kutilmoqda';
            }
            if(st.burst){
             $('burstBtn').textContent='⏹ 1s/1 rasmni to‘xtatish ('+(st.burstCount||0)+')';
             $('burstBtn').classList.add('r');
            }else{
             $('burstBtn').textContent='⚡ 1s/1 rasm (fonda ham)';
             $('burstBtn').classList.remove('r');
            }
            const b64=Android.getLatestFrame();
            if(b64&&b64.length>20){
             const sig=b64.length+':'+b64.slice(0,24)+':'+b64.slice(-24);
             if(sig!==lastFrameSig){
              lastFrameSig=sig;
              $('ip').src='data:image/jpeg;base64,'+b64;
             }
            }
            syncTick++;
            if(syncTick%4===0){
             updateScheduleStatus();
             syncNativeEvents();
            }
           }catch(e){}
          }

          function init(){
           S.src=S.src||'phone';
           S.facing=S.facing||'environment';
           S.dur=Math.max(0,+(S.dur||0));
           S.imgRes=S.imgRes||'max';
           S.imgQual=+(S.imgQual||0.95);
           S.tStart=S.tStart||'08:00';
           S.tEnd=S.tEnd||'22:00';
           if(S.fsched===undefined)S.fsched=false;
           for(const k of ['tok','cid','sens','src','facing','imgRes','tStart','tEnd'])$(k).value=S[k];
           $('imgQual').value=String(S.imgQual);
           syncDurationUI();
           for(const [k,i] of Object.entries(F))$(i).value=S[k]||'';
           for(const k of ['fv','fp','fk','fw','fsched'])$(k).checked=!!S[k];
           updateCamBadge();
           updateScheduleStatus();
           renderLog();
           clearInterval(previewTimer);
           previewTimer=setInterval(pollNativePreview,260);
           if(ld('qoriqlash_run',false)){
            pushConfigToNative(true);
           }
          }

          function save(){
           Object.assign(S,{
            src:$('src').value,
            facing:$('facing').value,
            dur:Math.max(0,+(S.dur||0)),
            imgRes:$('imgRes').value,
            imgQual:+($('imgQual').value||0.95),
            fsched:$('fsched').checked,
            tStart:$('tStart').value||'08:00',
            tEnd:$('tEnd').value||'22:00',
            tok:$('tok').value.trim(),
            cid:$('cid').value.trim(),
            sens:+$('sens').value
           });
           for(const [k,i] of Object.entries(F))S[k]=$(i).value.trim();
           for(const k of ['fv','fp','fk','fw'])S[k]=$(k).checked;
           updateCamBadge();
           updateScheduleStatus();
           sv('qoriqlash_s',S);
           if(run)pushConfigToNative(true);
          }

          function onSrcChange(){save();}
          function onFacingChange(){save();}

          function flipFacing(){
           S.facing=S.facing==='environment'?'user':'environment';
           $('facing').value=S.facing;
           save();
           msg('hs','Kamera almashtirildi: '+(S.facing==='user'?'Oldi kamera':'Orqa kamera'),'ok');
          }

          function tab(n,b){for(const x of ['home','set','log'])$('t-'+x).classList.toggle('hide',x!==n);
           document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
          const msg=(id,t,c)=>{$(id).textContent=t;$(id).className='st '+(c||'')};

          const API=m=>`https://api.telegram.org/bot${S.tok}/${m}`;
          async function testTg(){save();msg('s2','Tekshirilmoqda...');
           try{const a=await(await fetch(API('getMe'))).json();if(!a.ok)throw 0;
            const b=await(await fetch(API('sendMessage'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:S.cid,text:'✅ Qo‘riqlash ulandi'})})).json();
            b.ok?msg('s2','✅ Ulandi: @'+a.result.username,'ok'):msg('s2','❌ Chat ID noto‘g‘ri (botga /start yozing)','er')}
           catch(e){msg('s2','❌ Token noto‘g‘ri yoki internet yo‘q','er')}}

          const NP={};let nid=0;
          window.onSnap=(id,b64)=>{const f=NP[id];if(f){delete NP[id];f(b64)}};
          function ipFrameByUrl(u){return new Promise((res,rej)=>{
           if(!u)return rej(new Error('no_url'));
           if(window.Android){const id=++nid;
            NP[id]=b=>{if(!b)return rej(new Error('x'));const bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);res(new Blob([a],{type:'image/jpeg'}))};
            setTimeout(()=>{if(NP[id]){delete NP[id];rej(new Error('t'))}},9500);
            Android.snap(id,u,S.usr||'',S.pwd||'')}
           else fetch(u,{cache:'no-store'}).then(r=>r.ok?r.blob():Promise.reject()).then(res,rej)})}

          async function testIp(){save();msg('s3','NVR / IP kanallar tekshirilmoqda...');const ok=[],bad=[];
           const list=camTargets();
           if(!list.length){msg('s3','❌ Kamida bitta IP manzil yoki URL kiriting','er');return;}
           for(const t of list){try{const b=await ipFrameByUrl(t.url);const u=URL.createObjectURL(b);$('pv').src=u;$('pv').classList.remove('hide');ok.push(`${t.label} (${Math.round(b.size/1024)}KB)`)}catch(e){bad.push(t.label)}}
           if(!ok.length)msg('s3','❌ Ulanib bo‘lmadi. IP, login, parol va kanallarni tekshiring','er');
           else msg('s3','✅ Ishlayapti: '+ok.join(', ')+(bad.length?' | ❌ ulanmadi: '+bad.join(', '):''),'ok')}

          async function checkPhotoFormat(){
           save();
           if(!window.Android){msg('s1','Faqat APK ichida ishlaydi','er');return;}
           const b64=Android.getLatestFrame();
           if(!b64){msg('s1','Avval Nazoratni boshlang — kadr olinmoqda...','er');return;}
           const bin=atob(b64);
           const kb=Math.round(bin.length/1024);
           const img=new Image();
           img.onload=()=>msg('s1',`✅ Jonli kadr: image/jpeg | ${img.width}x${img.height} | ${kb} KB`,'ok');
           img.src='data:image/jpeg;base64,'+b64;
          }

          function toggle1sBurst(){
           save();
           if(!run){
            toggle();
           }
           if(window.Android&&typeof Android.setBgBurst==='function'){
            const st=JSON.parse(Android.getBgState());
            const next=!st.burst;
            Android.setBgBurst(next,Math.max(0,+(S.dur||0)));
            add('photo',next?'Fonda 1s/1 rasm yoqildi':'Fonda 1s/1 rasm to‘xtatildi');
            msg('hs',next?'⚡ Fonda 1s/1 rasm yoqildi':'⚡ 1s/1 rasm to‘xtatildi','ok');
           }
          }

          async function toggle(){
           if(run){stop();return}
           save();
           if(S.src==='ip'&&!camTargets().length){
            msg('hs','❌ Avval Sozlamadan IP manzil yoki URL kiriting','er');
            return;
           }
           sv('qoriqlash_run',true);
           pushConfigToNative(true);
           add('motion','Tezkor fon nazorati yoqildi');
           msg('hs','✅ Tezkor nazorat ishga tushdi','ok');
           if(S.fw&&navigator.wakeLock)try{wl=await navigator.wakeLock.request('screen')}catch(e){}
          }

          function stop(){
           sv('qoriqlash_run',false);
           pushConfigToNative(false);
           wl&&wl.release().catch(()=>{});wl=null;
           add('motion','Nazorat To‘xtatish buyrug‘i bilan to‘xtatildi');
           msg('hs','⏹ Nazorat to‘xtatildi','');
          }

          function shot(){
           if(!run){msg('hs','Avval nazoratni boshlang','er');return;}
           if(window.Android&&typeof Android.bgShotNow==='function'){
            Android.bgShotNow();
            add('photo','Qo‘lda rasm yuborildi');
            msg('hs','📸 Rasm Telegramga yuborildi','ok');
           }
          }

          function iconFor(t){
           if(t==='sound')return '🔊';
           if(t==='photo')return '📸';
           if(t==='att')return '🕘';
           return '🎬';
          }
          function add(t,x){LOG.unshift({t,x,d:new Date().toLocaleString('uz'),ts:Date.now()});LOG=LOG.slice(0,300);sv('qoriqlash_log',LOG);renderLog()}
          function renderLog(){const q=$('q')?$('q').value.toLowerCase():'';
           $('log').innerHTML=LOG.filter(e=>(e.x+e.d).toLowerCase().includes(q)).map(e=>`<div class="ev">${iconFor(e.t)} ${e.x}<small>${e.d}</small></div>`).join('')||'<div class="st">Hodisa yo‘q</div>';
           const td=LOG.filter(e=>Date.now()-e.ts<864e5).length;$('cnt').textContent='So‘nggi 24 soatda: '+td+' ta hodisa'}
          function clr(){LOG=[];sv('qoriqlash_log',LOG);if(window.Android&&Android.clearNativeEvents)Android.clearNativeEvents();renderLog()}
          </script></body></html>
          EOF

          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qoriqlash-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
